<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Your Car</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <a href="./index.html">
            <img class="img1" src="./images/ChatGPT Image Oct 3, 2025, 04_27_29 PM.png">
        </a>
        <h1>Car Shipping Form</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="buy.html">Buy Cars</a></li>
                <li><a href="sell.html">Sell Cars</a></li>
                <li><a href="shipping.html">Shipping</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <section class="shipping-form-section">
        <div class="container">
            <h2>Enter Your Shipping Details</h2>
            <form class="shipping-form">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required>
                <label>Pickup Address</label>
                <textarea placeholder="Enter pickup location" required></textarea>
                <label>Delivery Address</label>
                <textarea placeholder="Enter delivery location" required></textarea>
                <label>Car Make / Model / Year</label>
                <input type="text" placeholder="e.g. Toyota Camry 2020" required>
                <label>Preferred Shipping Date</label>
                <input type="date" required>
                <button type="submit">Submit Request</button>
            </form>
        </div>
    </section>
    <footer>
        <p>&copy; 2025 FastRun. All rights reserved.</p>
    </footer>
</body>

</html>
